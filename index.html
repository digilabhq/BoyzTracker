<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Boyz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0C0C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ─── AUTH SCREEN ─── -->
<div id="authScreen" class="auth-screen">
  <div id="authBg" class="auth-bg"></div>
  <div class="auth-vignette"></div>
  <div class="auth-content">
    <div class="auth-title">The Boyz</div>
    <div class="auth-subtitle">Leo & Benny</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-pad" id="pinPad">
      <div class="pin-key" data-val="1">1</div>
      <div class="pin-key" data-val="2">2</div>
      <div class="pin-key" data-val="3">3</div>
      <div class="pin-key" data-val="4">4</div>
      <div class="pin-key" data-val="5">5</div>
      <div class="pin-key" data-val="6">6</div>
      <div class="pin-key" data-val="7">7</div>
      <div class="pin-key" data-val="8">8</div>
      <div class="pin-key" data-val="9">9</div>
      <div class="pin-key empty"></div>
      <div class="pin-key" data-val="0">0</div>
      <div class="pin-key back" data-val="back">&#9003;</div>
    </div>
    <div id="authStatus" class="auth-status">Enter PIN</div>
  </div>
</div>

<!-- ─── MAIN APP ─── -->
<div id="app" class="app">
  <div id="appBg" class="app-bg"></div>
  <div class="app-vignette"></div>
  <div class="app-content">

    <div class="sync-badge">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">connecting</span>
    </div>

    <div class="app-header">
      <div class="app-title">The Boyz</div>
      <div class="app-tagline">Leo & Benny</div>
    </div>

    <div class="gold-rule"></div>

    <div class="stats-bar">
      <div class="stat-group">
        <div class="stat-num rp" id="rpCount">0</div>
        <div class="stat-paw"><img src="images/icons/paw-blue.png" alt=""></div>
      </div>
      <span class="stat-diamond">◆</span>
      <div class="stat-group">
        <div class="stat-paw"><img src="images/icons/paw-purple.png" alt=""></div>
        <div class="stat-num vr" id="vrCount">0</div>
      </div>
    </div>

    <div class="month-nav">
      <button class="month-arrow" id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="month-arrow" id="nextMonth">›</button>
    </div>

    <div class="weekday-row">
      <div class="weekday-name">S</div><div class="weekday-name">M</div><div class="weekday-name">T</div>
      <div class="weekday-name">W</div><div class="weekday-name">T</div><div class="weekday-name">F</div><div class="weekday-name">S</div>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="bottom-actions">
      <button class="action-link" id="shareBtn">Share</button>
      <button class="action-link" id="reportBtn">Report</button>
      <button class="action-link" id="yearBtn">Year</button>
      <button class="action-link" id="lockBtn">Lock</button>
    </div>

  </div>
</div>

<!-- ─── EDITOR MODAL (Compact) ─── -->
<div class="modal-overlay" id="editOverlay"></div>
<div class="modal" id="editModal">
  <div class="modal-handle"></div>

  <div class="edit-header">
    <div class="edit-date" id="editTitle"></div>
    <div class="edit-pills">
      <button class="owner-pill" id="optRP">
        <img src="images/icons/paw-blue.png"> <span>RP</span>
      </button>
      <button class="owner-pill" id="optVR">
        <img src="images/icons/paw-purple.png"> <span>VR</span>
      </button>
    </div>
  </div>

  <div class="edit-gold-rule"></div>

  <div class="section-label">What happened today?</div>
  <div id="entriesList"></div>
  <button class="add-entry-btn" id="addEntryBtn">+ Add entry</button>

  <div class="photo-upload" id="photoArea">
    <div class="photo-upload-box" id="photoUploadContent">
      📷
      <input type="file" id="photoInput" accept="image/*">
    </div>
    <img class="photo-preview" id="previewImg">
    <span class="photo-upload-label">Add photo</span>
  </div>

  <div class="edit-actions">
    <div class="edit-actions-left">
      <button class="edit-action-text delete" id="deleteBtn">Delete</button>
    </div>
    <div class="edit-actions-right">
      <button class="edit-action-text cancel" id="cancelBtn">Cancel</button>
      <button class="edit-action-text save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ─── REPORT MODAL (Timeline) ─── -->
<div class="modal-overlay" id="reportOverlay"></div>
<div class="modal" id="reportModal">
  <div class="modal-handle"></div>
  <div class="report-header" id="reportTitle"></div>
  <div class="report-subtitle">Monthly Report</div>

  <div class="report-stats">
    <div class="report-stat rp"><img src="images/icons/paw-blue.png" alt=""> <span id="reportRpCount"></span></div>
    <div class="report-stat vr"><img src="images/icons/paw-purple.png" alt=""> <span id="reportVrCount"></span></div>
    <div class="report-stat entries"><span id="reportEntryCount"></span></div>
  </div>

  <div id="reportTimeline"></div>

  <div class="report-actions">
    <button class="report-action" id="reportShare">Share</button>
    <button class="report-action" id="reportExport">Export</button>
    <button class="report-action close" id="reportClose">Close</button>
  </div>
</div>

<!-- ─── YEAR SUMMARY MODAL ─── -->
<div class="modal-overlay" id="yearOverlay"></div>
<div class="modal" id="yearModal">
  <div class="modal-handle"></div>
  <div class="year-title" id="yearTitle"></div>
  <div class="year-chart" id="yearChart"></div>
  <div class="year-actions">
    <button class="report-action" id="yearExport">Export</button>
    <button class="report-action close" id="yearClose">Close</button>
  </div>
</div>

<!-- ─── PHOTO VIEWER ─── -->
<div class="photo-viewer" id="photoViewer">
  <img id="viewerImg" src="">
  <div class="caption" id="viewerCaption"></div>
  <button class="close-viewer" id="closeViewer">Close</button>
</div>

<!-- ─── NOTE VIEWER ─── -->
<div class="note-viewer" id="noteViewer">
  <div class="note-content" id="viewerNote"></div>
  <button class="close-viewer" id="closeNoteViewer">Close</button>
</div>

<!-- ─── TOAST ─── -->
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>

</body>
</html>
